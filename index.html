<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="socials and links." />
    <link rel="icon" type="image/png" href="img/moonlett.png" />
    <title>moonlett</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="page-shell">
        <div class="moon-wrap" aria-label="moonlett logo">
            <img class="moon-img" src="img/moonlett.png" alt="moonlett logo" data-default="img/moonlett.png"
                data-hover="img/moonlettowo.png" />
        </div>

        <div class="card">
            <header class="masthead">
                <img class="chicken-img" src="img/chickeneclipes.png" alt="Chicken background" />
            </header>

            <main class="content">
                <h2 class="social-title">My Socials</h2>

                <div class="social-links">
                    <a class="social-item" href="https://steamcommunity.com/id/moonlett" target="_blank"
                        rel="noreferrer">
                        <span class="social-label">Steam:</span>
                        <span class="social-value">Moonlett</span>
                    </a>

                    <div class="social-item static-item">
                        <span class="social-label">Discord:</span>
                        <span class="social-text">Moonlett</span>
                    </div>

                    <a class="social-item" href="https://www.rootapp.com/" target="_blank" rel="noreferrer">
                        <span class="social-label">RootApp:</span>
                        <span class="social-value">Moonlett</span>
                    </a>

                    <a class="social-item" href="https://www.twitch.tv/xmoonlett" target="_blank" rel="noreferrer">
                        <span class="social-label">Twitch:</span>
                        <span class="social-value">xMoonlett</span>
                    </a>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
